[package]
name = "carrack-cli"
version = "0.3.1"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
carrack-client = { path = "../carrack-client" }
clap = { version = "4.5.53", features = ["derive", "env"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread"] }
zeroize = "1.8.2"

[[bin]]
name = "carrack"
path = "src/bin/carrack.rs"

[[bin]]
name = "carrackctl"
path = "src/bin/carrackctl.rs"

[lints]
workspace = true
