[package]
name = "skydriver-cli"
version = "0.3.6"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
skydriver-client = { path = "../skydriver-client" }
clap = { version = "4.5.53", features = ["derive", "env"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread"] }
zeroize = "1.8.2"

[[bin]]
name = "skydriver"
path = "src/bin/skydriver.rs"

[[bin]]
name = "skydriverctl"
path = "src/bin/skydriverctl.rs"

[lints]
workspace = true
