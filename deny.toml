[graph]
targets = ["x86_64-unknown-linux-gnu", "wasm32-unknown-unknown"]
all-features = true

[advisories]
ignore = []

[licenses]
allow = [
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
confidence-threshold = 0.8

[licenses.private]
ignore = true

[bans]
multiple-versions = "deny"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
# The Worker/WASM, HTTP test server, and native WebSocket stacks target
# different runtimes. Their internal bridges stay subject to every non-ban
# cargo-deny check.
skip-tree = [
  # Cardea's Ed25519 verifier uses the RustCrypto 0.11 digest generation while
  # Skydriver preserves its existing 0.10 content-hash implementation.
  { name = "ed25519-dalek", version = "=3.0.0" },
  { name = "worker" },
  { name = "httpmock" },
  { name = "tokio-tungstenite" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["ssh://git@github.com/dravengarden/cardea.git"]
