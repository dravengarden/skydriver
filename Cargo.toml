[workspace]
members = [
  "control-plane",
  "crates/carrack-client",
  "crates/carrack-cli",
  "crates/carrack-sdk-core",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "UNLICENSED"
rust-version = "1.91"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
pedantic = "warn"
