[workspace]
members = [
  "control-plane",
  "crates/carrack-client",
  "crates/carrack-cli",
  "crates/carrack-driver-contract",
  "crates/carrack-metadata-cache",
  "crates/carrack-sdk-core",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "UNLICENSED"
rust-version = "1.91"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"
unexpected_cfgs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
# Carrack is an internal application workspace, not a crates.io release.
cargo_common_metadata = { level = "allow", priority = 1 }
# The native, Worker, and test stacks intentionally bridge compatible versions.
multiple_crate_versions = { level = "allow", priority = 1 }

[profile.dev]
debug = "line-tables-only"
