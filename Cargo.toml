[workspace]
members = [
  "control-plane",
  "crates/skydriver-client",
  "crates/skydriver-cli",
  "crates/skydriver-driver-contract",
  "crates/skydriver-metadata-cache",
  "crates/skydriver-sdk-core",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/dravengarden/skydriver"
readme = "README.md"
publish = false
rust-version = "1.97.1"

[workspace.lints.rust]
warnings = "deny"
missing_docs = "warn"
unsafe_code = "forbid"
unexpected_cfgs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
# The workspace is released from source rather than as a crates.io bundle.
cargo_common_metadata = { level = "allow", priority = 1 }
# The native, Worker, and test stacks intentionally bridge compatible versions.
multiple_crate_versions = { level = "allow", priority = 1 }

[profile.dev]
debug = "line-tables-only"
