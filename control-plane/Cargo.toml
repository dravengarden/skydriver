[package]
name = "carrack-control-plane"
version = "0.3.6"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
aes-gcm = { version = "0.10.3", default-features = false, features = ["aes", "alloc"] }
base64 = "0.22.1"
carrack-driver-contract = { path = "../crates/carrack-driver-contract" }
carrack-sdk-core = { path = "../crates/carrack-sdk-core" }
getrandom = { version = "0.4.3", features = ["wasm_js"] }
hex = "0.4.3"
hmac = "0.12.1"
hkdf = "0.12.4"
js-sys = "0.3.83"
quick-xml = { version = "0.41.0", features = ["serialize"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
unicode-normalization = "0.1.25"
wasm-bindgen = "0.2.126"
worker = { version = "0.8.5", features = ["d1"] }
zeroize = "1.8.2"

[lints]
workspace = true
